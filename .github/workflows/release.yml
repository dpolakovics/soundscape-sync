name: Release
on:
  push:
    tags:
      - 'v*.*'
permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22
      - name: Install fyne-cross
        run: go install github.com/fyne-io/fyne-cross@latest
      - name: Cross-compile for Linux
        run: fyne-cross linux
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: fyne-cross/bin/linux-amd64

  build-windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22
      - name: Install fyne-cross
        run: go install github.com/fyne-io/fyne-cross@latest
      - name: Cross-compile for Windows
        run: fyne-cross windows
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: fyne-cross/bin/windows-amd64

  build-mac:
    runs-on: macos-latest
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22
      - name: Compile for MacOS
        run: |
          GOOS=darwin GOARCH=arm64 go build -o SoundscapeSync_arm64
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 go build -o SoundscapeSync_amd64
          lipo -create -output SoundscapeSync SoundscapeSync_amd64 SoundscapeSync_arm64
          mkdir -p SoundscapeSync.app/Contents/MacOS
          mv SoundscapeSync SoundscapeSync.app/Contents/MacOS/SoundscapeSync
          echo '<?xml version="1.0" encoding="UTF-8"?>' > SoundscapeSync.app/Contents/Info.plist
          echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' >> SoundscapeSync.app/Contents/Info.plist
          echo '<plist version="1.0">' >> SoundscapeSync.app/Contents/Info.plist
          echo '<dict>' >> SoundscapeSync.app/Contents/Info.plist
          echo '  <key>CFBundleName</key>' >> SoundscapeSync.app/Contents/Info.plist
          echo '  <string>SoundscapeSync</string>' >> SoundscapeSync.app/Contents/Info.plist
          echo '  <key>CFBundleDisplayName</key>' >> SoundscapeSync.app/Contents/Info.plist
          echo '  <string>Soundscape Sync</string>' >> SoundscapeSync.app/Contents/Info.plist
          echo '  <key>CFBundleVersion</key>' >> SoundscapeSync.app/Contents/Info.plist
          echo '  <string>1.0</string>' >> SoundscapeSync.app/Contents/Info.plist
          echo '  <key>CFBundleShortVersionString</key>' >> SoundscapeSync.app/Contents/Info.plist
          echo '  <string>1.0</string>' >> SoundscapeSync.app/Contents/Info.plist
          echo '  <key>CFBundleIdentifier</key>' >> SoundscapeSync.app/Contents/Info.plist
          echo '  <string>com.cloonar.soundscape-sync</string>' >> SoundscapeSync.app/Contents/Info.plist
          echo '  <key>CFBundleExecutable</key>' >> SoundscapeSync.app/Contents/Info.plist
          echo '  <string>SoundscapeSync</string>' >> SoundscapeSync.app/Contents/Info.plist
          echo '  <key>CFBundlePackageType</key>' >> SoundscapeSync.app/Contents/Info.plist
          echo '  <string>APPL</string>' >> SoundscapeSync.app/Contents/Info.plist
          echo '  <key>LSMinimumSystemVersion</key>' >> SoundscapeSync.app/Contents/Info.plist
          echo '  <string>11.0</string>' >> SoundscapeSync.app/Contents/Info.plist
          echo '</dict>' >> SoundscapeSync.app/Contents/Info.plist
          echo '</plist>' >> SoundscapeSync.app/Contents/Info.plist
          chmod +x SoundscapeSync.app/Contents/MacOS/SoundscapeSync

      - name: Install certificate
        if: ${{ env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_PASSWORD != '' }}
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_P12_PASSWORD: ${{ secrets.MAC_CERT_P12_PASSWORD }}
        run: |
          mkdir -p ~/certs
          echo "$MAC_CERT_P12" | base64 --decode > ~/certs/mac_dev_cert.p12
          security create-keychain -p "" build.keychain
          security import ~/certs/mac_dev_cert.p12 -k build.keychain -P "$MAC_CERT_P12_PASSWORD" -A
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain

      - name: Sign App
        if: ${{ env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_PASSWORD != '' }}
        env:
          MAC_CERT_NAME: ${{ secrets.MAC_CERT_NAME }}
        run: |
          # Sign the main executable first
          codesign --force --options runtime \
            --entitlements .github/workflows/entitlements.plist \
            --sign "$MAC_CERT_NAME" \
            --timestamp \
            SoundscapeSync.app/Contents/MacOS/SoundscapeSync

          # Then sign the app bundle
          codesign --force --options runtime \
            --entitlements .github/workflows/entitlements.plist \
            --sign "$MAC_CERT_NAME" \
            --timestamp \
            SoundscapeSync.app

      - name: Verify signature
        if: ${{ env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_PASSWORD != '' }}
        run: |
          # Verify codesign integrity
          codesign --verify --strict --verbose=4 SoundscapeSync.app

          # Display signature details
          codesign --display --verbose=4 SoundscapeSync.app

          # Check Gatekeeper assessment (will fail before notarization, but useful for debugging)
          spctl --assess --verbose=4 --type execute SoundscapeSync.app || echo "Gatekeeper check failed (expected before notarization)"

      - name: Zip macOS build
        run: zip -r SoundscapeSync.app.zip SoundscapeSync.app

      - name: Notarize App
        if: ${{ env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_PASSWORD != '' }}
        run: |
          xcrun notarytool submit SoundscapeSync.app.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_PASSWORD" \
            --wait

      - name: Staple Notarization
        if: ${{ env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_PASSWORD != '' }}
        run: xcrun stapler staple SoundscapeSync.app

      - name: Re-zip macOS build
        if: ${{ env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_PASSWORD != '' }}
        run: zip -r SoundscapeSync.app.zip SoundscapeSync.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: SoundscapeSync.app.zip

  create-release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-mac]
    steps:
      - name: Generate Changelog
        id: changelog
        uses: requarks/changelog-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}

      # download all build artifacts
      - uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: dist/linux
      - uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: dist/windows
      - uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: dist/macos

      - run: |
          mv checksum.txt dist/checksum.txt
          mv dist/macos/SoundscapeSync.app.zip dist/macos/MacOS.zip
          mv dist/linux/soundscape-sync dist/linux/soundscape-sync-linux-x86

      - name: Generate checksum
        uses: jmgilman/actions-generate-checksum@v1
        with:
          patterns: |
            dist/windows/SoundscapeSync.exe
            dist/macos/MacOS.zip

      - name: Create GitHub Release & upload assets
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changes }}
          draft: false
          prerelease: true
          files: |
            dist/linux/**/*
            dist/windows/SoundscapeSync.exe
            dist/macos/MacOS.zip
            dist/checksum.txt
